name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Checkout camel-mcp dependency
        uses: actions/checkout@v4
        with:
          repository: dscope-io/dscope-camel-mcp
          path: camel-mcp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & install camel-mcp into local Maven repo
        run: mvn -B -f camel-mcp/pom.xml -DskipTests install

      - name: Maven - Build & Unit Tests
        run: mvn -B -q clean verify

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**/*.txt

  release-artifacts:
    name: Package Release Artifacts
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Checkout camel-mcp dependency
        uses: actions/checkout@v4
        with:
          repository: dscope-io/dscope-camel-mcp
          path: camel-mcp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & install camel-mcp into local Maven repo
        run: mvn -B -f camel-mcp/pom.xml -DskipTests install

      - name: Build (No Tests) for Release
        run: mvn -B -q -DskipTests package

      - name: Upload Distribution Archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: |
            target/camel-snowflake-*-distribution.zip
            target/camel-snowflake-*-distribution.tar.gz

      # Placeholder: if you later configure signing & deployment (e.g. to Maven Central)
      # add a step here using maven settings with server credentials & GPG.
      # - name: Deploy to OSSRH
      #   run: mvn -B -P release deploy -DskipTests -s .github/maven-settings.xml

      - name: Generate Release Notes Summary
        id: notes
        run: |
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "See CHANGELOG.md for full details." >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.changes }}
          files: |
            target/camel-snowflake-*-distribution.zip
            target/camel-snowflake-*-distribution.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
