# Auto-load all YAML routes from classpath:routes/*.yaml
camel.main.routes-include-pattern=classpath:routes/*.yaml

# Toggle for one-shot demo timer routes (select/insert). The provided YAML
# files are always loaded if present on the classpath, but you can delete or
# rename them in production. This property is referenced only in docs for now
# (no conditional loading in pure YAML); move routes to Java DSL to gate:
#   if (Boolean.getBoolean("sample.enableOnce")) { ... }
sample.enableOnce=true

# Snowflake connection properties (fill in for your account)
snowflake.account=du62692.west-europe.azure
snowflake.database=SAMPLES
snowflake.schema=PUBLIC
snowflake.warehouse=DATAFEED_WH
snowflake.role=sample_role
# Intentionally omit username and privateKey here; set them via JVM -D snowflake.* properties:
#   -Dsnowflake.username=your_username
#   -Dsnowflake.privateKey=(PKCS#8 PEM or Base64; newlines as \n)
# Choose authenticator: snowflake | snowflake_jwt | externalbrowser | oauth
# For private key auth, use snowflake_jwt
snowflake.authenticator=snowflake_jwt

# Parameter binding config
snowflake.enableParameterBinding=true
snowflake.parameterPrefix=snowflake.

# Output format for the route body: rows | json | xml | arrow
# rows  = List<Map<String,Object>>
# json  = JSON string (requires jackson-databind on classpath)
# xml   = XML string
# arrow = Use Arrow in JDBC (requires JVM --add-opens flags)
snowflake.outputFormat=json

# Default dynamic query (can be overridden at runtime using header 'sql')
# Use current session database, and schema-qualified table
snowflake.query=SELECT * FROM PUBLIC.SOME_TABLE WHERE USER_ID = :#user_id AND CREATED_AT >= :#min_date

# Sample default parameter values (used if not provided via headers)
snowflake.param.user_id=0
snowflake.param.min_date=1970-01-01

# Example: pass-through Snowflake JDBC options via URI using jdbc.*
# You can add these to the route URI as needed, for example:
#   jdbc.CLIENT_SESSION_KEEP_ALIVE=true
#   jdbc.OCSP_FAIL_OPEN=true
# They will be URL-encoded and appended to the JDBC URL.

# ------------------------------------------------------------
# Insert route (snowflake-insert.yaml)
# Default INSERT SQL (used if the Exchange header 'sql' is not provided)
# Inserts JSON into VARIANT using INSERT .. SELECT .. parse_json(..) FROM VALUES
snowflake.insert.sql=INSERT INTO PUBLIC.SOME_TABLE (ID, USER_ID, CREATED_AT, AMOUNT, DETAILS) SELECT :#id, :#user_id, CURRENT_TIMESTAMP(), :#amount, parse_json(src.v) FROM VALUES (:#details_json::string) AS src(v)

# Note: The insert route expects these headers at runtime for parameter binding:
#   - snowflake.id, snowflake.user_id, snowflake.amount, snowflake.details_json
# You can provide them from the message producer (e.g., via REST, timer, or another route).

# ------------------------------------------------------------
# Stored procedure sample (snowflake-proc-once.yaml)
# Procedure defined in setup.sql: insert_new_sample_row(id NUMBER, amount NUMBER, details VARIANT)
# Returns a STRING. Header override precedence: CamelSnowflakeQuery/header 'sql' > property.
snowflake.proc.insertSample=CALL INSERT_NEW_SAMPLE_ROW(:#user_id,:#amount,:#details_json)
