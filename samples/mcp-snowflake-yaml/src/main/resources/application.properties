# Camel Main configuration for MCP Snowflake sample
camel.main.routes-include-pattern=classpath:routes/*.yaml
camel.main.basePackageScan=io.dscope.camel.snowflake.mcp

# Snowflake connection properties (fill in for your account)
snowflake.account=du62692.west-europe.azure
snowflake.database=SAMPLES
snowflake.schema=PUBLIC
snowflake.warehouse=DATAFEED_WH
snowflake.role=sample_role
# Intentionally omit username and privateKey here; set them via JVM -D snowflake.* properties:
#   -Dsnowflake.username=your_username
#   -Dsnowflake.privateKey=(PKCS#8 PEM or Base64; newlines as \n)
# Choose authenticator: snowflake | snowflake_jwt | externalbrowser | oauth
# For private key auth, use snowflake_jwt
snowflake.authenticator=snowflake_jwt

# Parameter binding config
snowflake.enableParameterBinding=true
snowflake.parameterPrefix=snowflake.